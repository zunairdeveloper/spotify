<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Spotify Music Player</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="overlay">

<div class="player">

<img src="spotify pic.png" class="logo">

<h2 id="songName">Alex Morgan</h2>

<p id="artistName">Spotify Music Player</p>

<img src="gui.gif" class="equalizer">

<audio id="audio"></audio>

<input
type="range"
id="progress"
value="0"
min="0"
max="100">

<div class="time">

<span id="current">00:00</span>

<span id="duration">00:00</span>

</div>

<div class="buttons">

<button id="back">

<i class="fa-solid fa-backward"></i>

</button>

<button id="play">

<i class="fa-solid fa-play"></i>

</button>

<button id="next">

<i class="fa-solid fa-forward"></i>

</button>

</div>

<div class="volume">

<i class="fa-solid fa-volume-high"></i>

<input
type="range"
id="volume"
min="0"
max="1"
step="0.1"
value="1">

</div>

<div class="playlist">

<h3>Playlist</h3>

<ul id="playlist">

<li>Alex Morgan</li>

<li>Kontraa Nasha</li>

<li>HitsLab Hindi Song</li>

<li>Apalon Beats</li>

</ul>

</div>

</div>

</div>

<script src="script.js"></script>

</body>

</html>
